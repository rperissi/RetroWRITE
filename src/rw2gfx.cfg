# RetroWrite II (graphics) memory map
#   $0800-$0FFF  ProDOS file buffers (2)      $1000-$13FF  C stack
#   $1400-$1DFF  line buffer                  $1E00-$1EFF  text scratch
#   $2000-$3FFF  double hi-res page 1 (main + aux)
#   $4000-OVL    resident program             OVL-$BEFF    overlay region
#   $D400-$DFFF  language card (file RW2.LC, loaded at startup): aux-memory
#                routines, font metrics, some code
#   $1000-$11FF I/O buffer, $1200-$13FF C stack, $1F00-$1FDF path/find strings
#   aux $4000-$B6FF document text, aux $B700-$BFFF font bitmaps
SYMBOLS {
    __STACKSIZE__: type = weak, value = $0000;
    __LCADDR__:    type = weak, value = $D400;
    __LCSIZE__:    type = weak, value = $0C00;
    __OVLADDR__:   type = weak, value = $A190;
}
MEMORY {
    ZP:     file = "", define = yes, start = $0080,         size = $001A;
    MAIN:   file = %O, define = yes, start = $4000,         size = __OVLADDR__ - $4000, fill = yes;
    MAINX:  file = %O,               start = __OVLADDR__,   size = $BF00 - __OVLADDR__;
    BSS:    file = "",               start = __ONCE_RUN__,  size = __OVLADDR__ - __ONCE_RUN__;
    LC:     file = "%O.L", define = yes, start = __LCADDR__,   size = __LCSIZE__;
    LOW:    file = "",               start = $0200,         size = $01D0;
    TXT1:   file = "",               start = $0400,         size = $0078;
    TXT2:   file = "",               start = $0480,         size = $0078;
    AUXF:   file = "%O.F",           start = $B700,         size = $0900;
    OVL1:   file = "%O.1",           start = __OVLADDR__,   size = $BF00 - __OVLADDR__;
    OVL2:   file = "%O.2",           start = __OVLADDR__,   size = $BF00 - __OVLADDR__;
    OVL3:   file = "%O.3",           start = __OVLADDR__,   size = $BF00 - __OVLADDR__;
    OVL4:   file = "%O.4",           start = __OVLADDR__,   size = $BF00 - __OVLADDR__;
    OVL5:   file = "%O.5",           start = __OVLADDR__,   size = $BF00 - __OVLADDR__;
    OVL6:   file = "%O.6",           start = __OVLADDR__,   size = $BF00 - __OVLADDR__;
    OVL7:   file = "%O.7",           start = __OVLADDR__,   size = $BF00 - __OVLADDR__;
    OVL8:   file = "%O.8",           start = __OVLADDR__,   size = $BF00 - __OVLADDR__;
    OVL9:   file = "%O.9",           start = __OVLADDR__,   size = $BF00 - __OVLADDR__;
    OVLA:   file = "%O.A",           start = __OVLADDR__,   size = $BF00 - __OVLADDR__;
    OVLB:   file = "%O.B",           start = __OVLADDR__,   size = $BF00 - __OVLADDR__;
    OVLC:   file = "%O.C",           start = __OVLADDR__,   size = $BF00 - __OVLADDR__;
}
SEGMENTS {
    ZEROPAGE: load = ZP,             type = zp;
    STARTUP:  load = MAIN,           type = ro;
    LOWCODE:  load = MAIN,           type = ro,  optional = yes;
    CODE:     load = MAIN,           type = ro;
    RODATA:   load = MAIN,           type = ro;
    DATA:     load = MAIN,           type = rw;
    INIT:     load = MAIN,           type = rw;
    ONCE:     load = MAIN,           type = ro,  define   = yes;
    STARTCODE: load = MAINX,         type = ro;
    LC:       load = LC,             type = ro;
    AUXFONT:  load = AUXF,           type = ro;
    BSS:      load = BSS,            type = bss, define   = yes;
    LOWBSS:   load = LOW,            type = bss, optional = yes;   # overlays only, not cleared
    TXTBSS1:  load = TXT1,           type = bss, optional = yes;   # text page (not displayed)
    TXTBSS2:  load = TXT2,           type = bss, optional = yes;
    OVL1:     load = OVL1,           type = ro,  define = yes;
    OVL1BSS:  load = OVL1,           type = bss, optional = yes;
    OVL2:     load = OVL2,           type = ro,  define = yes;
    OVL2BSS:  load = OVL2,           type = bss, optional = yes;
    OVL3:     load = OVL3,           type = ro,  define = yes;
    OVL3BSS:  load = OVL3,           type = bss, optional = yes;
    OVL4:     load = OVL4,           type = ro,  define = yes;
    OVL4BSS:  load = OVL4,           type = bss, optional = yes;
    OVL5:     load = OVL5,           type = ro,  define = yes;
    OVL5BSS:  load = OVL5,           type = bss, optional = yes;
    OVL6:     load = OVL6,           type = ro,  define = yes;
    OVL6BSS:  load = OVL6,           type = bss, optional = yes;
    OVL7:     load = OVL7,           type = ro,  define = yes;
    OVL7BSS:  load = OVL7,           type = bss, optional = yes;
    OVL8:     load = OVL8,           type = ro,  define = yes;
    OVL8BSS:  load = OVL8,           type = bss, optional = yes;
    OVL9:     load = OVL9,           type = ro,  define = yes;
    OVL9BSS:  load = OVL9,           type = bss, optional = yes;
    OVLA:     load = OVLA,           type = ro,  define = yes;
    OVLABSS:  load = OVLA,           type = bss, optional = yes;
    OVLB:     load = OVLB,           type = ro,  define = yes;
    OVLBBSS:  load = OVLB,           type = bss, optional = yes;
    OVLC:     load = OVLC,           type = ro,  define = yes;
    OVLCBSS:  load = OVLC,           type = bss, optional = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
